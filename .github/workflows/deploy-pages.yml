name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "src/web/server.py"
      - "src/prediction/**"
      - "scripts/build_static.py"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # peaceiris/actions-gh-pages はまだ Node 20 build。
      # 2026-09-16 の Node 20 削除後も動くよう Node 24 を強制する。
      # 公式 actions が Node 24 対応した v5/v6 を使えば本来不要だが、
      # third-party が追随するまでの暫定。
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build static pages
        run: python -m scripts.build_static --mode demo --output dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
